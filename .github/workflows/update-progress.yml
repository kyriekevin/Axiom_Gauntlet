name: Update progress maps

on:
  push:
    branches: [main]
    paths:
      - "problems/**"
      - "src/axiom_gauntlet/**"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "17 0 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Verify source data
        run: |
          uv run ruff check .
          uv run pytest
          uv run axiom validate

      - name: Render progress maps
        run: uv run axiom render

      - name: Commit changed maps
        run: |
          if git diff --quiet -- assets/heatmaps; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmaps
          git commit -m "Update activity heatmaps"
          git push

