[project]
name = "axiom-gauntlet"
version = "0.1.0"
description = "Tooling for a multi-platform algorithm practice journal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tomlkit>=0.13",
]

[project.scripts]
axiom = "axiom_gauntlet.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv]
required-version = ">=0.11.14"
